# Despliegue en Netlify. El adaptador @astrojs/netlify genera las funciones de servidor y publica el sitio.
# Las variables (DATABASE_URL, etc.) se configuran en Netlify → Site configuration → Environment variables.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Cabeceras de seguridad para los archivos estáticos. Las páginas generadas en el servidor las reciben desde
# src/middleware.ts (src/lib/security-headers.ts). MANTENER IGUAL que ese archivo y que vercel.json.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-aVQv6qs+SUAnPBNkAgYn5NLuxBArKoWEbL2nL/q6qLo=' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; frame-src https://www.google.com https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
